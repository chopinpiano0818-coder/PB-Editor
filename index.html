<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>PB Editor v0.2</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <b>
    PB Editor
    <small>v0.2</small>
  </b>

  <div>
    <button id="undo">↶</button>
    <button id="redo">↷</button>
    <button id="save">保存</button>
    <button id="export">動画</button>
  </div>
</header>


<main>

  <!-- プレビュー -->
  <section class="preview">

    <div id="wrap">
      <div id="stage">

        <!-- スナップガイド -->
        <i id="gv"></i>
        <i id="gh"></i>

      </div>
    </div>


    <!-- 再生 -->
    <div class="transport">

      <button id="play">
        ▶︎
      </button>

      <span id="clock">
        00:00.00 / 00:10.00
      </span>

      <input
        id="seek"
        type="range"
        min="0"
        max="10"
        step=".01"
        value="0"
      >

    </div>

  </section>


  <!-- タイムライン -->
  <section class="timeline">

    <div class="tlhead">

      タイムライン

      <label>
        長さ

        <input
          id="duration"
          type="number"
          value="10"
          min="1"
          max="600"
          step=".1"
        >

        秒
      </label>

    </div>

    <div id="tracks"></div>

  </section>


  <!-- PIP詳細設定 -->
  <aside id="inspector" hidden>

    <div class="itop">

      <b id="iname">
        PIP
      </b>

      <button id="close">
        ×
      </button>

    </div>


    <!-- テキスト設定 -->
    <div id="textPanel" hidden>

      <label>
        テキスト

        <input
          id="itext"
          type="text"
        >
      </label>


      <label>
        文字サイズ

        <input
          id="ifs"
          type="number"
          min="8"
          max="300"
        >
      </label>


      <label>
        文字色

        <input
          id="icolor"
          type="color"
        >
      </label>

    </div>


    <!-- 動画PIP設定 -->
    <div id="videoPanel" hidden>

      <label>
        動画音量 %

        <input
          id="ivol"
          type="number"
          min="0"
          max="100"
        >
      </label>

    </div>


    <!-- 精密数値設定 -->
    <div class="grid">

      <label>
        X
        <input
          id="ix"
          type="number"
          step=".1"
        >
      </label>


      <label>
        Y
        <input
          id="iy"
          type="number"
          step=".1"
        >
      </label>


      <label>
        幅
        <input
          id="iw"
          type="number"
          min="1"
          step=".1"
        >
      </label>


      <label>
        高さ
        <input
          id="ih"
          type="number"
          min="1"
          step=".1"
        >
      </label>


      <label>
        回転 °
        <input
          id="ir"
          type="number"
          step=".1"
        >
      </label>


      <label>
        透明度 %
        <input
          id="io"
          type="number"
          min="0"
          max="100"
        >
      </label>


      <label>
        開始 秒
        <input
          id="is"
          type="number"
          min="0"
          step=".01"
        >
      </label>


      <label>
        終了 秒
        <input
          id="ie"
          type="number"
          min="0"
          step=".01"
        >
      </label>

    </div>


    <!-- PIP操作 -->
    <div class="actions">

      <button id="key">
        ◇ キー
      </button>

      <button id="anim">
        アニメ
      </button>

      <button id="front">
        最前面
      </button>

      <button id="back">
        最背面
      </button>

      <button id="dup">
        複製
      </button>

      <button id="del">
        削除
      </button>

    </div>

  </aside>

</main>


<!-- 下部ツール -->
<nav>

  <label class="btn">

    ＋ PIP

    <input
      id="files"
      type="file"
      accept="image/*,video/*,.svg"
      multiple
      hidden
    >

  </label>


  <button id="text">
    文字
  </button>


  <button id="center">
    中央
  </button>


  <button id="fit">
    フィット
  </button>


  <button id="aspect">
    9:16
  </button>

</nav>


<!-- メッセージ表示 -->
<div id="toast"></div>


<!-- 編集処理 -->
<script src="app.js"></script>

</body>
</html>
