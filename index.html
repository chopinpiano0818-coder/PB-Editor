<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="
    width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no,
    viewport-fit=cover
  "
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<title>PB Editor v3.0</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>


<body>


<!-- ======================================================
     HOME
====================================================== -->

<section
  id="homeScreen"
  class="screen active"
>


<header class="homeHeader">

  <div class="brand">

    <div class="logo">
      PB
    </div>

    <div>

      <h1>
        PB Editor
      </h1>

      <small>
        v3.0 Editor Rebuild
      </small>

    </div>

  </div>


  <button
    id="settingsBtn"
    class="iconBtn"
  >
    ⚙
  </button>

</header>



<main class="homeContent">


<!-- NEW PROJECT -->

<section class="homeSection">

<h2>
  新しく作る
</h2>


<div class="createGrid">


<label class="createCard primary">

  <div class="createIcon">
    ▶
  </div>

  <b>
    ビデオ
  </b>

  <span>
    動画・写真から作成
  </span>

  <input
    id="newProjectMedia"
    type="file"
    accept="video/*,image/*"
    multiple
    hidden
  >

</label>



<button
  id="newBlankProject"
  class="createCard"
>

  <div class="createIcon">
    ＋
  </div>

  <b>
    空のプロジェクト
  </b>

  <span>
    素材をあとから追加
  </span>

</button>


</div>

</section>



<!-- RECENT PROJECTS -->

<section class="homeSection">


<div class="sectionTitle">

<h2>
  最近のプロジェクト
</h2>

<span id="storageStatus">
  IndexedDB
</span>

</div>


<div
  id="projectGrid"
  class="projectGrid"
></div>


</section>


</main>

</section>



<!-- ======================================================
     EDITOR
====================================================== -->

<section
  id="editorScreen"
  class="screen"
>


<!-- ======================================================
     TOP BAR
====================================================== -->

<header class="editorHeader">


<button
  id="editorBack"
  class="iconBtn"
>
  ‹
</button>



<div class="projectTitle">

<input
  id="projectName"
  value="新しいプロジェクト"
>

<small id="saveStatus">
  保存済み
</small>

</div>



<button
  id="undoBtn"
  class="iconBtn"
>
  ↶
</button>


<button
  id="redoBtn"
  class="iconBtn"
>
  ↷
</button>



<button
  id="exportBtn"
  class="exportBtn"
>
  保存
</button>


</header>



<!-- ======================================================
     EDITOR BODY
====================================================== -->

<main class="editorBody">


<!-- ======================================================
     PREVIEW AREA
====================================================== -->

<section class="previewArea">


<div id="previewViewport">


<div id="canvas">


<!-- CENTER GUIDES -->

<div
  id="guideX"
  class="snapGuide vertical"
></div>


<div
  id="guideY"
  class="snapGuide horizontal"
></div>


<!-- OTHER SNAP GUIDES -->

<div
  id="guideLeft"
  class="snapGuide vertical edgeGuide"
></div>


<div
  id="guideRight"
  class="snapGuide vertical edgeGuide"
></div>


<div
  id="guideTop"
  class="snapGuide horizontal edgeGuide"
></div>


<div
  id="guideBottom"
  class="snapGuide horizontal edgeGuide"
></div>


</div>

</div>



<!-- ======================================================
     PREVIEW CONTROLS
====================================================== -->

<div class="previewControls">


<button
  id="jumpStartBtn"
  class="smallControl"
>
  |‹
</button>


<button
  id="playBtn"
  class="playButton"
>
  ▶
</button>


<div
  id="timeDisplay"
  class="timeDisplay"
>
  00:00.00 / 00:10.00
</div>


<button
  id="fullscreenPreview"
  class="smallControl"
>
  ⛶
</button>


</div>


</section>



<!-- ======================================================
     TIMELINE AREA
====================================================== -->

<section
  id="timelineArea"
  class="timelineArea"
>


<!-- TIMELINE HEADER -->

<div class="timelineHeader">


<button
  id="timelineZoomOut"
>
  −
</button>


<div class="timelineTitle">
  タイムライン
</div>


<button
  id="timelineZoomIn"
>
  ＋
</button>


</div>



<!-- ======================================================
     TIMELINE VIEWPORT
====================================================== -->

<div
  id="timelineViewport"
  class="timelineViewport"
>


<div
  id="timelineContent"
  class="timelineContent"
>


<!-- LEFT SPACER -->

<div
  id="timelineLeftSpacer"
  class="timelineSpacer"
></div>



<!-- ======================================================
     TIME RULER
====================================================== -->

<div
  id="timelineRuler"
  class="timelineRuler"
></div>



<!-- ======================================================
     TRACK CONTAINER
====================================================== -->

<div
  id="trackContainer"
  class="trackContainer"
>


<!-- OVERLAY TRACKS -->

<div
  id="overlayTracks"
  class="overlayTracks"
></div>



<!-- MAIN VIDEO TRACK -->

<div
  id="mainTrack"
  class="track mainTrack"
>

<div class="trackLabel">
  VIDEO
</div>

<div
  id="mainTrackClips"
  class="trackClips"
></div>

</div>



<!-- TEXT TRACK -->

<div
  id="textTrack"
  class="track overlayTrack"
>

<div class="trackLabel">
  TEXT
</div>

<div
  id="textTrackClips"
  class="trackClips"
></div>

</div>



<!-- PIP TRACK -->

<div
  id="pipTrack"
  class="track overlayTrack"
>

<div class="trackLabel">
  PIP
</div>

<div
  id="pipTrackClips"
  class="trackClips"
></div>

</div>



<!-- AUDIO TRACK -->

<div
  id="audioTrack"
  class="track audioTrack"
>

<div class="trackLabel">
  AUDIO
</div>

<div
  id="audioTrackClips"
  class="trackClips"
></div>

</div>


</div>



<!-- RIGHT SPACER -->

<div
  id="timelineRightSpacer"
  class="timelineSpacer"
></div>


</div>



<!-- ======================================================
     FIXED PLAYHEAD
====================================================== -->

<div
  id="fixedPlayhead"
  class="fixedPlayhead"
>

<div class="playheadHead">
</div>

<div class="playheadLine">
</div>

</div>


</div>


</section>


</main>



<!-- ======================================================
     MAIN TOOL BAR
====================================================== -->

<nav
  id="mainToolbar"
  class="bottomToolbar"
>


<label class="toolButton">

<div class="toolIcon">
  ＋
</div>

<span>
  素材
</span>

<input
  id="addMainMedia"
  type="file"
  accept="video/*,image/*"
  multiple
  hidden
>

</label>



<button
  class="toolButton"
  data-main-tool="canvas"
>

<div class="toolIcon">
  ▣
</div>

<span>
  キャンバス
</span>

</button>



<button
  class="toolButton"
  data-main-tool="music"
>

<div class="toolIcon">
  ♫
</div>

<span>
  音楽
</span>

</button>



<button
  class="toolButton"
  data-main-tool="text"
>

<div class="toolIcon">
  T
</div>

<span>
  テキスト
</span>

</button>



<label class="toolButton">

<div class="toolIcon">
  ◫
</div>

<span>
  PIP
</span>

<input
  id="addPipMedia"
  type="file"
  accept="video/*,image/*"
  multiple
  hidden
>

</label>



<button
  class="toolButton"
  data-main-tool="sticker"
>

<div class="toolIcon">
  ☺
</div>

<span>
  ステッカー
</span>

</button>



<button
  class="toolButton"
  data-main-tool="background"
>

<div class="toolIcon">
  ▧
</div>

<span>
  背景
</span>

</button>


</nav>



<!-- ======================================================
     CLIP TOOL BAR
====================================================== -->

<nav
  id="clipToolbar"
  class="bottomToolbar"
  hidden
>


<button
  class="toolButton"
  data-clip-tool="done"
>

<div class="toolIcon">
  ✓
</div>

<span>
  完了
</span>

</button>



<button
  class="toolButton"
  data-clip-tool="split"
>

<div class="toolIcon">
  ✂
</div>

<span>
  分割
</span>

</button>



<button
  class="toolButton"
  data-clip-tool="trim"
>

<div class="toolIcon">
  ↔
</div>

<span>
  トリミング
</span>

</button>



<button
  class="toolButton"
  data-clip-tool="speed"
>

<div class="toolIcon">
  1×
</div>

<span>
  速度
</span>

</button>



<button
  class="toolButton"
  data-clip-tool="volume"
>

<div class="toolIcon">
  🔊
</div>

<span>
  音量
</span>

</button>



<button
  class="toolButton"
  data-clip-tool="animation"
>

<div class="toolIcon">
  ✦
</div>

<span>
  アニメーション
</span>

</button>



<button
  class="toolButton"
  data-clip-tool="keyframe"
>

<div class="toolIcon">
  ◇
</div>

<span>
  キー
</span>

</button>



<button
  class="toolButton"
  data-clip-tool="transform"
>

<div class="toolIcon">
  ↗
</div>

<span>
  変形
</span>

</button>



<button
  class="toolButton"
  data-clip-tool="crop"
>

<div class="toolIcon">
  ⛶
</div>

<span>
  クロップ
</span>

</button>



<button
  class="toolButton"
  data-clip-tool="filter"
>

<div class="toolIcon">
  ◐
</div>

<span>
  フィルター
</span>

</button>



<button
  class="toolButton"
  data-clip-tool="layer"
>

<div class="toolIcon">
  ☷
</div>

<span>
  レイヤー
</span>

</button>



<button
  class="toolButton"
  data-clip-tool="rotate"
>

<div class="toolIcon">
  ↻
</div>

<span>
  回転
</span>

</button>



<button
  class="toolButton"
  data-clip-tool="flip"
>

<div class="toolIcon">
  ⇆
</div>

<span>
  反転
</span>

</button>



<button
  class="toolButton"
  data-clip-tool="duplicate"
>

<div class="toolIcon">
  ▣
</div>

<span>
  複製
</span>

</button>



<button
  class="toolButton danger"
  data-clip-tool="delete"
>

<div class="toolIcon">
  ⌫
</div>

<span>
  削除
</span>

</button>


</nav>


</section>



<!-- ======================================================
     BOTTOM EDIT SHEET
====================================================== -->

<section
  id="editSheet"
  class="editSheet"
  hidden
>


<div class="sheetHandle">
</div>



<header class="sheetHeader">


<button
  id="sheetCancel"
  class="sheetHeaderButton"
>
  ×
</button>


<b id="sheetTitle">
  編集
</b>


<button
  id="sheetApply"
  class="sheetHeaderButton apply"
>
  ✓
</button>


</header>



<div
  id="sheetContent"
  class="sheetContent"
>
</div>


</section>



<!-- ======================================================
     TEXT EDITOR
====================================================== -->

<section
  id="textEditor"
  class="modalEditor"
  hidden
>


<header class="modalHeader">


<button id="textCancel">
  ×
</button>


<b>
  テキスト
</b>


<button id="textApply">
  ✓
</button>


</header>



<div class="textInputArea">


<textarea
  id="textInput"
  placeholder="テキストを入力"
></textarea>


</div>



<div class="textControls">


<label>

サイズ

<input
  id="textSize"
  type="range"
  min="8"
  max="160"
  value="32"
>

</label>



<label>

色

<input
  id="textColor"
  type="color"
  value="#ffffff"
>

</label>



<label>

縁取り

<input
  id="textStroke"
  type="range"
  min="0"
  max="12"
  value="0"
>

</label>


</div>


</section>



<!-- ======================================================
     ANIMATION PANEL
====================================================== -->

<section
  id="animationPanel"
  class="editSheet"
  hidden
>


<div class="sheetHandle">
</div>


<header class="sheetHeader">


<button id="animationClose">
  ×
</button>


<b>
  アニメーション
</b>


<button id="animationApply">
  ✓
</button>


</header>



<div class="animationTabs">


<button
  data-animation-tab="in"
  class="active"
>
  入る
</button>


<button
  data-animation-tab="out"
>
  出る
</button>


<button
  data-animation-tab="loop"
>
  ループ
</button>


<button
  data-animation-tab="pb"
>
  PB
</button>


</div>



<div
  id="animationList"
  class="animationList"
>
</div>



<div class="animationSettings">


<label>

時間

<input
  id="animationDuration"
  type="range"
  min=".1"
  max="5"
  value=".5"
  step=".1"
>

</label>



<label>

強さ

<input
  id="animationStrength"
  type="range"
  min="0"
  max="200"
  value="100"
>

</label>


</div>


</section>



<!-- ======================================================
     CONTEXT MENU
====================================================== -->

<div
  id="contextMenu"
  class="contextMenu"
  hidden
>


<button data-context="duplicate">
  複製
</button>


<button data-context="front">
  最前面
</button>


<button data-context="back">
  最背面
</button>


<button
  data-context="delete"
  class="danger"
>
  削除
</button>


</div>



<!-- ======================================================
     TOAST
====================================================== -->

<div
  id="toast"
  class="toast"
></div>



<!-- ======================================================
     HIDDEN VIDEO FOR THUMBNAILS
====================================================== -->

<video
  id="thumbnailVideo"
  muted
  playsinline
  preload="metadata"
  hidden
></video>


<canvas
  id="thumbnailCanvas"
  width="160"
  height="90"
  hidden
></canvas>



<script src="app.js"></script>


</body>

</html>
