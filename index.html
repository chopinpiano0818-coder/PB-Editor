<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PB Editor v1.0 Base</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <button id="back">‹</button>

  <b>
    PB Editor
    <small>v1.0 Base</small>
  </b>

  <div>
    <button id="undo">↶</button>
    <button id="redo">↷</button>
    <button id="save">保存</button>
    <button id="export">書き出し</button>
  </div>
</header>


<main>

  <section class="preview">

    <div id="viewer">
      <div id="stage"></div>
    </div>

    <div class="transport">

      <button id="play">▶</button>

      <span id="clock">
        00:00.00 / 00:10.00
      </span>

      <input
        id="seek"
        type="range"
        min="0"
        max="10"
        value="0"
        step=".01"
      >

    </div>

  </section>


  <section class="timeline">
    <div id="tracks"></div>
  </section>

</main>


<nav id="toolbar">

  <label class="tool">
    ＋
    <span>素材</span>

    <input
      id="media"
      type="file"
      accept="image/*,video/*"
      multiple
      hidden
    >
  </label>


  <button
    class="tool"
    data-tool="canvas"
  >
    ▣
    <span>キャンバス</span>
  </button>


  <button
    class="tool"
    data-tool="text"
  >
    T
    <span>テキスト</span>
  </button>


  <button
    class="tool"
    data-tool="pip"
  >
    ◫
    <span>PIP</span>
  </button>


  <button
    class="tool"
    data-tool="filter"
  >
    ◐
    <span>調整</span>
  </button>

</nav>


<div
  id="clipbar"
  hidden
>

  <button data-action="split">
    ✂
    <span>分割</span>
  </button>

  <button data-action="trim">
    ↔
    <span>トリム</span>
  </button>

  <button data-action="speed">
    1×
    <span>速度</span>
  </button>

  <button data-action="volume">
    🔊
    <span>音量</span>
  </button>

  <button data-action="rotate">
    ↻
    <span>回転</span>
  </button>

  <button data-action="flip">
    ⇆
    <span>反転</span>
  </button>

  <button data-action="duplicate">
    ▣
    <span>複製</span>
  </button>

  <button data-action="key">
    ◇
    <span>キー</span>
  </button>

  <button data-action="delete">
    ⌫
    <span>削除</span>
  </button>

</div>


<section
  id="sheet"
  hidden
>

  <div class="sheetHead">

    <b id="sheetTitle"></b>

    <button id="sheetClose">
      ×
    </button>

  </div>

  <div id="sheetBody"></div>

</section>


<div id="toast"></div>


<script src="app.js"></script>

</body>
</html>
