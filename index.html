<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="
    width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no,
    viewport-fit=cover
  "
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>PB Editor v3.1</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =====================================================
     HOME
===================================================== -->

<section id="homeScreen" class="screen active">

<header class="homeHeader">

  <div class="brand">

    <div class="logo">
      PB
    </div>

    <div class="brandText">
      <h1>PB Editor</h1>
      <small>v3.1 Studio</small>
    </div>

  </div>

  <button id="settingsBtn" class="iconBtn">
    ⚙
  </button>

</header>


<main class="homeContent">

<section class="homeSection">

  <h2>新しく作る</h2>

  <div class="createGrid">

    <label class="createCard primary">

      <div class="createIcon">
        ▶
      </div>

      <b>ビデオ</b>

      <span>
        動画・写真から作成
      </span>

      <input
        id="newProjectMedia"
        type="file"
        accept="video/*,image/*"
        multiple
        hidden
      >

    </label>


    <button
      id="newBlankProject"
      class="createCard"
    >

      <div class="createIcon">
        ＋
      </div>

      <b>空のプロジェクト</b>

      <span>
        素材をあとから追加
      </span>

    </button>

  </div>

</section>


<section class="homeSection">

  <div class="sectionTitle">

    <h2>
      最近のプロジェクト
    </h2>

    <span id="storageStatus">
      IndexedDB
    </span>

  </div>

  <div
    id="projectGrid"
    class="projectGrid"
  ></div>

</section>

</main>

</section>


<!-- =====================================================
     EDITOR
===================================================== -->

<section id="editorScreen" class="screen">

<!-- =====================================================
     TOP HEADER
===================================================== -->

<header class="editorHeader">

  <button
    id="editorBack"
    class="iconBtn"
  >
    ‹
  </button>


  <div class="projectTitle">

    <input
      id="projectName"
      value="新しいプロジェクト"
    >

    <small id="saveStatus">
      保存済み
    </small>

  </div>


  <button
    id="undoBtn"
    class="iconBtn"
    title="元に戻す"
  >
    ↶
  </button>


  <button
    id="redoBtn"
    class="iconBtn"
    title="やり直す"
  >
    ↷
  </button>


  <button
    id="exportBtn"
    class="exportBtn"
  >
    保存
  </button>

</header>


<!-- =====================================================
     EDITOR BODY
===================================================== -->

<main class="editorBody">


<!-- =====================================================
     PREVIEW
===================================================== -->

<section class="previewArea">

<div id="previewViewport">

  <div id="canvas">

    <!-- SAFE AREA -->

    <div
      id="safeArea"
      class="safeArea"
      hidden
    ></div>


    <!-- SNAP GUIDES -->

    <div
      id="guideX"
      class="snapGuide vertical"
    ></div>

    <div
      id="guideY"
      class="snapGuide horizontal"
    ></div>

    <div
      id="guideLeft"
      class="snapGuide vertical edgeGuide"
    ></div>

    <div
      id="guideRight"
      class="snapGuide vertical edgeGuide"
    ></div>

    <div
      id="guideTop"
      class="snapGuide horizontal edgeGuide"
    ></div>

    <div
      id="guideBottom"
      class="snapGuide horizontal edgeGuide"
    ></div>


    <!-- DYNAMIC OBJECT GUIDES -->

    <div
      id="objectGuideX"
      class="snapGuide vertical objectGuide"
    ></div>

    <div
      id="objectGuideY"
      class="snapGuide horizontal objectGuide"
    ></div>

  </div>

</div>


<!-- =====================================================
     PREVIEW CONTROLS
===================================================== -->

<div class="previewControls">

  <button
    id="jumpStartBtn"
    class="smallControl"
  >
    |‹
  </button>


  <button
    id="previousKeyBtn"
    class="smallControl"
    title="前のキーフレーム"
  >
    ◇‹
  </button>


  <button
    id="playBtn"
    class="playButton"
  >
    ▶
  </button>


  <button
    id="nextKeyBtn"
    class="smallControl"
    title="次のキーフレーム"
  >
    ›◇
  </button>


  <div
    id="timeDisplay"
    class="timeDisplay"
  >
    00:00.00 / 00:10.00
  </div>


  <button
    id="fullscreenPreview"
    class="smallControl"
  >
    ⛶
  </button>

</div>

</section>


<!-- =====================================================
     TIMELINE
===================================================== -->

<section
  id="timelineArea"
  class="timelineArea"
>


<!-- TIMELINE HEADER -->

<div class="timelineHeader">

  <button
    id="trackManagerBtn"
    title="レイヤー"
  >
    ☷
  </button>


  <button
    id="timelineZoomOut"
  >
    −
  </button>


  <div class="timelineTitle">
    タイムライン
  </div>


  <button
    id="timelineZoomIn"
  >
    ＋
  </button>


  <button
    id="timelineFitBtn"
    title="全体表示"
  >
    ↔
  </button>

</div>


<!-- TIMELINE VIEWPORT -->

<div
  id="timelineViewport"
  class="timelineViewport"
>

<div
  id="timelineContent"
  class="timelineContent"
>


  <!-- RULER -->

  <div
    id="timelineRuler"
    class="timelineRuler"
  ></div>


  <!-- TRACKS -->

  <div
    id="trackContainer"
    class="trackContainer"
  >


    <!-- OVERLAY DYNAMIC TRACKS -->

    <div
      id="overlayTracks"
      class="overlayTracks"
    ></div>


    <!-- MAIN VIDEO -->

    <div
      id="mainTrack"
      class="track mainTrack"
    >

      <div class="trackLabel">
        VIDEO
      </div>

      <div
        id="mainTrackClips"
        class="trackClips"
      ></div>

    </div>


    <!-- TEXT -->

    <div
      id="textTrack"
      class="track overlayTrack"
    >

      <div class="trackLabel">
        TEXT
      </div>

      <div
        id="textTrackClips"
        class="trackClips"
      ></div>

    </div>


    <!-- PIP -->

    <div
      id="pipTrack"
      class="track overlayTrack"
    >

      <div class="trackLabel">
        PIP
      </div>

      <div
        id="pipTrackClips"
        class="trackClips"
      ></div>

    </div>


    <!-- STICKERS -->

    <div
      id="stickerTrack"
      class="track overlayTrack"
    >

      <div class="trackLabel">
        STICKER
      </div>

      <div
        id="stickerTrackClips"
        class="trackClips"
      ></div>

    </div>


    <!-- MUSIC -->

    <div
      id="musicTrack"
      class="track audioTrack"
    >

      <div class="trackLabel">
        MUSIC
      </div>

      <div
        id="musicTrackClips"
        class="trackClips"
      ></div>

    </div>


    <!-- SFX -->

    <div
      id="sfxTrack"
      class="track audioTrack"
    >

      <div class="trackLabel">
        SFX
      </div>

      <div
        id="sfxTrackClips"
        class="trackClips"
      ></div>

    </div>


  </div>

</div>


<!-- FIXED CENTER PLAYHEAD -->

<div
  id="fixedPlayhead"
  class="fixedPlayhead"
>

  <div class="playheadHead"></div>

  <div class="playheadLine"></div>

</div>


<!-- CURRENT KEYFRAME INDICATOR -->

<button
  id="floatingKeyframeBtn"
  class="floatingKeyframeBtn"
  title="キーフレーム"
>
  ◇
</button>


</div>

</section>

</main>


<!-- =====================================================
     MAIN TOOLBAR
===================================================== -->

<nav
  id="mainToolbar"
  class="bottomToolbar"
>


<label class="toolButton">

  <div class="toolIcon">
    ＋
  </div>

  <span>素材</span>

  <input
    id="addMainMedia"
    type="file"
    accept="video/*,image/*"
    multiple
    hidden
  >

</label>


<button
  class="toolButton"
  data-main-tool="canvas"
>

  <div class="toolIcon">
    ▣
  </div>

  <span>キャンバス</span>

</button>


<button
  class="toolButton"
  data-main-tool="music"
>

  <div class="toolIcon">
    ♫
  </div>

  <span>音楽</span>

</button>


<button
  class="toolButton"
  data-main-tool="sfx"
>

  <div class="toolIcon">
    ♪
  </div>

  <span>効果音</span>

</button>


<button
  class="toolButton"
  data-main-tool="text"
>

  <div class="toolIcon">
    T
  </div>

  <span>テキスト</span>

</button>


<label class="toolButton">

  <div class="toolIcon">
    ◫
  </div>

  <span>PIP</span>

  <input
    id="addPipMedia"
    type="file"
    accept="video/*,image/*"
    multiple
    hidden
  >

</label>


<button
  class="toolButton"
  data-main-tool="sticker"
>

  <div class="toolIcon">
    ☺
  </div>

  <span>ステッカー</span>

</button>


<button
  class="toolButton"
  data-main-tool="background"
>

  <div class="toolIcon">
    ▧
  </div>

  <span>背景</span>

</button>


<button
  class="toolButton"
  data-main-tool="safearea"
>

  <div class="toolIcon">
    ⌗
  </div>

  <span>安全領域</span>

</button>

</nav>


<!-- =====================================================
     SELECTED CLIP TOOLBAR
===================================================== -->

<nav
  id="clipToolbar"
  class="bottomToolbar"
  hidden
>


<button
  class="toolButton"
  data-clip-tool="done"
>

  <div class="toolIcon">
    ✓
  </div>

  <span>完了</span>

</button>


<button
  class="toolButton"
  data-clip-tool="split"
>

  <div class="toolIcon">
    ✂
  </div>

  <span>分割</span>

</button>


<button
  class="toolButton"
  data-clip-tool="trim"
>

  <div class="toolIcon">
    ↔
  </div>

  <span>トリム</span>

</button>


<button
  class="toolButton"
  data-clip-tool="speed"
>

  <div class="toolIcon">
    1×
  </div>

  <span>速度</span>

</button>


<button
  class="toolButton"
  data-clip-tool="volume"
>

  <div class="toolIcon">
    🔊
  </div>

  <span>音量</span>

</button>


<button
  class="toolButton"
  data-clip-tool="animation"
>

  <div class="toolIcon">
    ✦
  </div>

  <span>アニメ</span>

</button>


<button
  class="toolButton"
  data-clip-tool="keyframe"
>

  <div class="toolIcon">
    ◇
  </div>

  <span>キー</span>

</button>


<button
  class="toolButton"
  data-clip-tool="keyframeEditor"
>

  <div class="toolIcon">
    ◇⋯
  </div>

  <span>キー編集</span>

</button>


<button
  class="toolButton"
  data-clip-tool="transform"
>

  <div class="toolIcon">
    ↗
  </div>

  <span>変形</span>

</button>


<button
  class="toolButton"
  data-clip-tool="crop"
>

  <div class="toolIcon">
    ⛶
  </div>

  <span>クロップ</span>

</button>


<button
  class="toolButton"
  data-clip-tool="filter"
>

  <div class="toolIcon">
    ◐
  </div>

  <span>調整</span>

</button>


<button
  class="toolButton"
  data-clip-tool="layer"
>

  <div class="toolIcon">
    ☷
  </div>

  <span>レイヤー</span>

</button>


<button
  class="toolButton"
  data-clip-tool="lock"
>

  <div class="toolIcon">
    🔒
  </div>

  <span>ロック</span>

</button>


<button
  class="toolButton"
  data-clip-tool="visibility"
>

  <div class="toolIcon">
    ◉
  </div>

  <span>表示</span>

</button>


<button
  class="toolButton"
  data-clip-tool="rotate"
>

  <div class="toolIcon">
    ↻
  </div>

  <span>回転</span>

</button>


<button
  class="toolButton"
  data-clip-tool="flip"
>

  <div class="toolIcon">
    ⇆
  </div>

  <span>反転</span>

</button>


<button
  class="toolButton"
  data-clip-tool="copy"
>

  <div class="toolIcon">
    ⧉
  </div>

  <span>コピー</span>

</button>


<button
  class="toolButton"
  data-clip-tool="duplicate"
>

  <div class="toolIcon">
    ▣
  </div>

  <span>複製</span>

</button>


<button
  class="toolButton danger"
  data-clip-tool="delete"
>

  <div class="toolIcon">
    ⌫
  </div>

  <span>削除</span>

</button>

</nav>


<!-- =====================================================
     QUICK PASTE
===================================================== -->

<button
  id="pasteButton"
  class="pasteButton"
  hidden
>
  貼り付け
</button>

</section>


<!-- =====================================================
     GENERIC BOTTOM SHEET
===================================================== -->

<section
  id="editSheet"
  class="editSheet"
  hidden
>

<div class="sheetHandle"></div>

<header class="sheetHeader">

  <button
    id="sheetCancel"
    class="sheetHeaderButton"
  >
    ×
  </button>

  <b id="sheetTitle">
    編集
  </b>

  <button
    id="sheetApply"
    class="sheetHeaderButton apply"
  >
    ✓
  </button>

</header>

<div
  id="sheetContent"
  class="sheetContent"
></div>

</section>


<!-- =====================================================
     TEXT EDITOR
===================================================== -->

<section
  id="textEditor"
  class="modalEditor"
  hidden
>

<header class="modalHeader">

  <button id="textCancel">
    ×
  </button>

  <b>テキスト</b>

  <button id="textApply">
    ✓
  </button>

</header>


<div class="textPreview">

  <div id="textLivePreview">
    TEXT
  </div>

</div>


<div class="textInputArea">

<textarea
  id="textInput"
  placeholder="テキストを入力"
></textarea>

</div>


<div class="textControls">


<label>
  サイズ

  <input
    id="textSize"
    type="range"
    min="8"
    max="180"
    value="32"
  >
</label>


<label>
  文字色

  <input
    id="textColor"
    type="color"
    value="#ffffff"
  >
</label>


<label>
  縁取り

  <input
    id="textStroke"
    type="range"
    min="0"
    max="12"
    step=".5"
    value="0"
  >
</label>


<label>
  縁取り色

  <input
    id="textStrokeColor"
    type="color"
    value="#000000"
  >
</label>


<label>
  影

  <input
    id="textShadow"
    type="range"
    min="0"
    max="30"
    value="0"
  >
</label>


<label>
  背景

  <input
    id="textBackground"
    type="color"
    value="#000000"
  >
</label>


<label class="toggleLabel">

  <span>背景を表示</span>

  <input
    id="textBackgroundEnabled"
    type="checkbox"
  >

</label>


</div>

</section>


<!-- =====================================================
     ANIMATION PANEL
===================================================== -->

<section
  id="animationPanel"
  class="editSheet largeSheet"
  hidden
>

<div class="sheetHandle"></div>

<header class="sheetHeader">

  <button id="animationClose">
    ×
  </button>

  <b>
    アニメーション
  </b>

  <button id="animationApply">
    ✓
  </button>

</header>


<div class="animationTabs">

  <button
    data-animation-tab="in"
    class="active"
  >
    入る
  </button>

  <button data-animation-tab="out">
    出る
  </button>

  <button data-animation-tab="loop">
    ループ
  </button>

  <button data-animation-tab="pb">
    PB
  </button>

</div>


<div
  id="animationList"
  class="animationList"
></div>


<div class="animationSettings">

<label>

  時間

  <div class="rangeWithValue">

    <input
      id="animationDuration"
      type="range"
      min=".1"
      max="5"
      value=".5"
      step=".1"
    >

    <span id="animationDurationValue">
      0.5秒
    </span>

  </div>

</label>


<label>

  強さ

  <div class="rangeWithValue">

    <input
      id="animationStrength"
      type="range"
      min="0"
      max="200"
      value="100"
    >

    <span id="animationStrengthValue">
      100%
    </span>

  </div>

</label>


<label>

  回数

  <div class="rangeWithValue">

    <input
      id="animationCount"
      type="range"
      min="1"
      max="10"
      value="1"
    >

    <span id="animationCountValue">
      1
    </span>

  </div>

</label>

</div>

</section>


<!-- =====================================================
     KEYFRAME EDITOR
===================================================== -->

<section
  id="keyframePanel"
  class="editSheet"
  hidden
>

<div class="sheetHandle"></div>

<header class="sheetHeader">

  <button id="keyframeClose">
    ×
  </button>

  <b>
    キーフレーム
  </b>

  <button id="keyframeDone">
    ✓
  </button>

</header>


<div class="keyframeActions">

  <button id="keyPrevious">
    ‹ 前
  </button>

  <button id="keyAdd">
    ◇ 追加
  </button>

  <button id="keyNext">
    次 ›
  </button>

</div>


<div class="keyframeActions">

  <button
    id="keyDelete"
    class="dangerButton"
  >
    現在のキーを削除
  </button>

</div>


<div class="propertyGrid">

<label class="propertyWide">

  イージング

  <select id="keyframeEasing">

    <option value="linear">
      Linear
    </option>

    <option value="easeIn">
      Ease In
    </option>

    <option value="easeOut">
      Ease Out
    </option>

    <option value="easeInOut">
      Ease In-Out
    </option>

    <option value="back">
      Back
    </option>

    <option value="bounce">
      Bounce
    </option>

    <option value="elastic">
      Elastic
    </option>

    <option value="spring">
      Spring
    </option>

  </select>

</label>

</div>


<div class="easingPreview">

  <canvas
    id="easingCanvas"
    width="500"
    height="180"
  ></canvas>

</div>

</section>


<!-- =====================================================
     CROP EDITOR
===================================================== -->

<section
  id="cropEditor"
  class="modalEditor"
  hidden
>

<header class="modalHeader">

  <button id="cropCancel">
    ×
  </button>

  <b>
    クロップ
  </b>

  <button id="cropApply">
    ✓
  </button>

</header>


<div class="cropWorkspace">

  <div id="cropStage">

    <div id="cropMedia"></div>

    <div id="cropShadeTop"></div>
    <div id="cropShadeLeft"></div>
    <div id="cropShadeRight"></div>
    <div id="cropShadeBottom"></div>

    <div id="cropBox">

      <i
        class="cropHandle nw"
        data-crop-handle="nw"
      ></i>

      <i
        class="cropHandle ne"
        data-crop-handle="ne"
      ></i>

      <i
        class="cropHandle sw"
        data-crop-handle="sw"
      ></i>

      <i
        class="cropHandle se"
        data-crop-handle="se"
      ></i>

    </div>

  </div>

</div>


<div class="cropToolbar">

  <button data-crop-ratio="free">
    自由
  </button>

  <button data-crop-ratio="1:1">
    1:1
  </button>

  <button data-crop-ratio="4:3">
    4:3
  </button>

  <button data-crop-ratio="16:9">
    16:9
  </button>

  <button data-crop-ratio="9:16">
    9:16
  </button>

  <button id="cropReset">
    リセット
  </button>

</div>

</section>


<!-- =====================================================
     AUDIO PICKER
===================================================== -->

<section
  id="audioPanel"
  class="editSheet"
  hidden
>

<div class="sheetHandle"></div>

<header class="sheetHeader">

  <button id="audioClose">
    ×
  </button>

  <b id="audioPanelTitle">
    音楽
  </b>

  <button id="audioDone">
    ✓
  </button>

</header>


<div class="audioImport">

<label class="bigImportButton">

  ＋ ファイルから追加

  <input
    id="audioFileInput"
    type="file"
    accept="audio/*,video/*"
    hidden
  >

</label>

</div>


<div class="audioPresetTitle">
  PB Editor
</div>


<div
  id="audioPresetList"
  class="audioPresetList"
>

  <button data-audio-preset="pop">
    ✦
    <span>登場</span>
  </button>

  <button data-audio-preset="move">
    ➜
    <span>移動</span>
  </button>

  <button data-audio-preset="hit">
    ✹
    <span>衝突</span>
  </button>

  <button data-audio-preset="angry">
    〰
    <span>怒り</span>
  </button>

  <button data-audio-preset="boom">
    💥
    <span>爆発</span>
  </button>

</div>

</section>


<!-- =====================================================
     STICKER PANEL
===================================================== -->

<section
  id="stickerPanel"
  class="editSheet"
  hidden
>

<div class="sheetHandle"></div>

<header class="sheetHeader">

  <button id="stickerClose">
    ×
  </button>

  <b>
    ステッカー
  </b>

  <button id="stickerDone">
    ✓
  </button>

</header>


<div class="stickerGrid">

  <button data-sticker="💥">💥</button>
  <button data-sticker="💢">💢</button>
  <button data-sticker="💧">💧</button>
  <button data-sticker="❗">❗</button>
  <button data-sticker="❓">❓</button>
  <button data-sticker="⚡">⚡</button>
  <button data-sticker="🔥">🔥</button>
  <button data-sticker="✨">✨</button>
  <button data-sticker="⭐">⭐</button>
  <button data-sticker="💫">💫</button>
  <button data-sticker="☁️">☁️</button>
  <button data-sticker="💨">💨</button>

<div

  hidden
>

</button>

<button data-context="duplicate">

</button>

<button data-context="front">

</button>

<button data-context="back">

</button>

<button data-context="lock">
