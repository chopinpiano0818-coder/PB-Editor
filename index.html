<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
  >
  <title>PB Editor v0.3</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <b>PB Editor <small>v0.3</small></b>

  <div>
    <button id="undo">↶</button>
    <button id="redo">↷</button>
    <button id="save">保存</button>
    <button id="export">動画</button>
  </div>
</header>


<main>

  <section class="preview">

    <div id="wrap">

      <div id="stage">

        <i id="gv"></i>
        <i id="gh"></i>

      </div>

    </div>


    <div class="transport">

      <button id="play">▶︎</button>

      <span id="clock">
        00:00.00 / 00:10.00
      </span>

      <input
        id="seek"
        type="range"
        min="0"
        max="10"
        step=".01"
      >

    </div>

  </section>


  <section class="timeline">

    <div class="tlhead">

      タイムライン

      <label>
        長さ

        <input
          id="duration"
          type="number"
          value="10"
          min="1"
          max="600"
          step=".1"
        >

        秒
      </label>

    </div>

    <div id="tracks"></div>

  </section>

</main>


<nav id="mainTools">

  <label class="btn">

    ＋PIP

    <input
      id="files"
      type="file"
      accept="image/*,video/*,.svg"
      multiple
      hidden
    >

  </label>

  <button id="addText">
    文字
  </button>

  <button id="aspect">
    9:16
  </button>

</nav>


<div id="selectionBar" hidden>

  <button data-act="edit">
    詳細
  </button>

  <button data-act="key">
    ◇キー
  </button>

  <button data-act="anim">
    アニメ
  </button>

  <button data-act="center">
    中央
  </button>

  <button data-act="dup">
    複製
  </button>

  <button data-act="del">
    削除
  </button>

</div>


<aside id="panel" hidden>

  <div class="top">

    <b id="pname"></b>

    <button id="close">
      ×
    </button>

  </div>


  <div id="textOpts" hidden>

    <label>
      文字
      <input id="txt">
    </label>

    <label>
      サイズ
      <input id="fs" type="number">
    </label>

    <label>
      色
      <input id="color" type="color">
    </label>

  </div>


  <div class="grid">

    <label>
      X
      <input id="x" type="number" step=".1">
    </label>

    <label>
      Y
      <input id="y" type="number" step=".1">
    </label>

    <label>
      幅
      <input id="w" type="number">
    </label>

    <label>
      高さ
      <input id="h" type="number">
    </label>

    <label>
      回転
      <input id="r" type="number" step=".1">
    </label>

    <label>
      透明度
      <input id="o" type="number">
    </label>

    <label>
      開始
      <input id="start" type="number" step=".01">
    </label>

    <label>
      終了
      <input id="end" type="number" step=".01">
    </label>

    <label>
      イージング

      <select id="ease">
        <option>linear</option>
        <option>ease</option>
        <option>in</option>
        <option>out</option>
        <option>back</option>
      </select>

    </label>

  </div>

</aside>


<div id="animSheet" hidden>

  <b>アニメーション</b>

  <div>

    <button data-a="pop">
      ポップ
    </button>

    <button data-a="slide">
      スライド
    </button>

    <button data-a="bounce">
      バウンド
    </button>

    <button data-a="shake">
      震える
    </button>

    <button data-a="squash">
      ぷるん
    </button>

  </div>

  <button id="animClose">
    閉じる
  </button>

</div>


<div id="toast"></div>

<script src="app.js"></script>

</body>
</html>
