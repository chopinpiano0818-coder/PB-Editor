<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
>
<title>PB Editor v2.0</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
     HOME
========================= -->

<section id="home" class="screen active">

  <header class="homeHead">

    <div>
      <h1>PB Editor</h1>
      <small>v2.0 Studio</small>
    </div>

    <button id="settings">
      ⚙
    </button>

  </header>


  <main class="homeMain">

    <h2>新しく作る</h2>

    <div class="create">

      <label class="new primary">

        ▶

        <b>
          ビデオ
        </b>

        <span>
          動画・写真から作成
        </span>

        <input
          id="newMedia"
          type="file"
          accept="video/*,image/*"
          multiple
          hidden
        >

      </label>


      <button
        class="new"
        id="blank"
      >

        ＋

        <b>
          空のプロジェクト
        </b>

        <span>
          あとから素材を追加
        </span>

      </button>

    </div>


    <div class="sectionTitle">

      <h2>
        最近のプロジェクト
      </h2>

      <span id="storageState"></span>

    </div>


    <div
      id="projects"
      class="projects"
    ></div>

  </main>

</section>



<!-- =========================
     EDITOR
========================= -->

<section
  id="editor"
  class="screen"
>

  <header class="editHead">

    <button id="back">
      ‹
    </button>


    <div class="title">

      <input
        id="projectName"
        value="新しいプロジェクト"
      >

      <small id="saveState">
        保存済み
      </small>

    </div>


    <button id="undo">
      ↶
    </button>


    <button id="redo">
      ↷
    </button>


    <button
      class="export"
      id="export"
    >
      書き出し
    </button>

  </header>



  <!-- =========================
       WORKSPACE
  ========================= -->

  <main class="workspace">


    <!-- PREVIEW -->

    <section class="preview">

      <div id="viewer">

        <div id="stage">

          <div
            id="gx"
            class="guide v"
          ></div>

          <div
            id="gy"
            class="guide h"
          ></div>

        </div>

      </div>


      <div class="transport">

        <button id="play">
          ▶
        </button>

        <span id="clock">
          00:00.00 / 00:10.00
        </span>

        <button id="fit">
          □
        </button>

      </div>

    </section>



    <!-- =========================
         TIMELINE
    ========================= -->

    <section class="timeline">

      <div class="tlTop">

        <button id="zoomOut">
          −
        </button>

        <span>
          タイムライン
        </span>

        <button id="zoomIn">
          ＋
        </button>

      </div>


      <div
        id="tlScroll"
        class="tlScroll"
      >

        <div id="tlContent">


          <!-- RULER -->

          <div id="ruler"></div>


          <!-- PLAYHEAD -->

          <div id="playhead">

            <i></i>

          </div>


          <!-- TRACKS -->

          <div id="tracks"></div>


        </div>

      </div>

    </section>

  </main>



  <!-- =========================
       MAIN TOOLBAR
  ========================= -->

  <nav
    id="mainbar"
    class="bar"
  >


    <label>

      ＋

      <span>
        素材
      </span>

      <input
        id="media"
        type="file"
        accept="video/*,image/*"
        multiple
        hidden
      >

    </label>



    <button data-tool="canvas">

      ▣

      <span>
        キャンバス
      </span>

    </button>



    <button data-tool="text">

      T

      <span>
        テキスト
      </span>

    </button>



    <label>

      ◫

      <span>
        PIP
      </span>

      <input
        id="pip"
        type="file"
        accept="video/*,image/*"
        multiple
        hidden
      >

    </label>



    <button data-tool="adjust">

      ◐

      <span>
        調整
      </span>

    </button>



    <button data-tool="background">

      ▧

      <span>
        背景
      </span>

    </button>

  </nav>



  <!-- =========================
       SELECTED CLIP TOOLBAR
  ========================= -->

  <nav
    id="clipbar"
    class="bar"
    hidden
  >


    <button data-act="done">

      ✓

      <span>
        完了
      </span>

    </button>



    <button data-act="split">

      ✂

      <span>
        分割
      </span>

    </button>



    <button data-act="trim">

      ↔

      <span>
        トリム
      </span>

    </button>



    <button data-act="speed">

      1×

      <span>
        速度
      </span>

    </button>



    <button data-act="volume">

      🔊

      <span>
        音量
      </span>

    </button>



    <button data-act="transform">

      ◇

      <span>
        変形
      </span>

    </button>



    <button data-act="rotate">

      ↻

      <span>
        回転
      </span>

    </button>



    <button data-act="flip">

      ⇆

      <span>
        反転
      </span>

    </button>



    <button data-act="layer">

      ☷

      <span>
        レイヤー
      </span>

    </button>



    <button data-act="key">

      ◆

      <span>
        キー
      </span>

    </button>



    <button data-act="duplicate">

      ▣

      <span>
        複製
      </span>

    </button>



    <button
      class="danger"
      data-act="delete"
    >

      ⌫

      <span>
        削除
      </span>

    </button>

  </nav>

</section>



<!-- =========================
     BOTTOM SHEET
========================= -->

<section
  id="sheet"
  hidden
>

  <div class="handle"></div>


  <div class="sheetHead">

    <b id="sheetTitle"></b>

    <button id="sheetClose">
      ×
    </button>

  </div>


  <div id="sheetBody"></div>

</section>



<!-- =========================
     TOAST
========================= -->

<div id="toast"></div>



<script src="app.js"></script>

</body>
</html>
